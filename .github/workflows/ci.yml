name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Database tests create their own databases on this server, each migrated
    # from scratch.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: fpr
          POSTGRES_PASSWORD: fpr
          POSTGRES_DB: fpr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fpr -d fpr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://fpr:fpr@localhost:5432/fpr
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci .

      - run: pnpm typecheck

      - run: pnpm contracts:openapi --check

      - run: pnpm db:migrate

      - run: pnpm test

      - run: pnpm build

  docker:
    name: Docker image (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [web, api, prices]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the image from the repository root, as compose.yaml does, and
      # never pushes it. Layers are cached in the GitHub Actions cache, one
      # scope per app.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
