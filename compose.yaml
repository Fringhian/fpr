name: fpr

# Containers whose output vector collects.
x-logged: &logged
  fpr.logs: "true"

services:
  # The only public port. The host's reverse proxy terminates TLS and forwards to it.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:80
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels: *logged
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # PORT stays at its default, 3000: web forwards /api to api:3000.
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      ADMIN_BOOTSTRAP_KEY: ${ADMIN_BOOTSTRAP_KEY:?Set ADMIN_BOOTSTRAP_KEY in .env}
      PSEUDONYM_SECRET: ${PSEUDONYM_SECRET:?Set PSEUDONYM_SECRET in .env}
      PRICES_URL: ${PRICES_URL:-http://prices:3000}
      PRICES_TOKEN: ${PRICES_TOKEN:?Set PRICES_TOKEN in .env}
      RACE_TIMEZONE: ${RACE_TIMEZONE:-Europe/Paris}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    labels: *logged
    restart: unless-stopped

  prices:
    build:
      context: .
      dockerfile: apps/prices/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      PRICES_TOKEN: ${PRICES_TOKEN:?Set PRICES_TOKEN in .env}
      PRICE_PROVIDER: ${PRICE_PROVIDER:?Set PRICE_PROVIDER in .env}
      PRICE_PROVIDER_API_KEY: ${PRICE_PROVIDER_API_KEY:?Set PRICE_PROVIDER_API_KEY in .env}
      RATES_URL: ${RATES_URL:-https://api.frankfurter.dev}
      PROVIDER_DAILY_CALL_LIMIT: ${PROVIDER_DAILY_CALL_LIMIT:-1000}
      REFRESH_SCHEDULE: "${REFRESH_SCHEDULE:-*/30 9-22 * * 1-5}"
      RACE_TIMEZONE: ${RACE_TIMEZONE:-Europe/Paris}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    labels: *logged
    restart: unless-stopped

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    labels: *logged
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    profiles: [storage]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels: *logged
    restart: unless-stopped

  # Creates the bucket on first start, then exits.
  rustfs-bucket:
    image: amazon/aws-cli:2.38.1
    profiles: [storage]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$BUCKET"
    labels: *logged
    restart: "no"

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${LOGS_RETENTION:-100y}
      - -retention.maxDiskSpaceUsageBytes=${LOGS_MAX_DISK:-20GB}
      - -httpAuth.username=${LOGS_USERNAME:?Set LOGS_USERNAME in .env}
      - -httpAuth.password=${LOGS_PASSWORD:?Set LOGS_PASSWORD in .env}
    ports:
      - 127.0.0.1:${LOGS_PORT:-9428}:9428
    volumes:
      - victorialogs-data:/victoria-logs-data
    networks: [logs]
    restart: unless-stopped

  vector:
    image: timberio/vector:0.60.0-alpine
    environment:
      # Lets deploy/vector.yaml read the two variables below, the only ones
      # this container has.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      LOGS_USERNAME: ${LOGS_USERNAME:?Set LOGS_USERNAME in .env}
      LOGS_PASSWORD: ${LOGS_PASSWORD:?Set LOGS_PASSWORD in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on: [victorialogs]
    networks: [logs]
    restart: unless-stopped

networks:
  logs:

volumes:
  postgres-data:
  rustfs-data:
  victorialogs-data:
