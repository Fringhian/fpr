name: fpr

# Containers whose output vector collects.
x-logged: &logged
  fpr.logs: "true"

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    labels: *logged
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    profiles: [storage]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    labels: *logged
    restart: unless-stopped

  # Creates the bucket on first start, then exits.
  rustfs-bucket:
    image: amazon/aws-cli:2.38.1
    profiles: [storage]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket "$$BUCKET"
    labels: *logged
    restart: "no"

  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${LOGS_RETENTION:-100y}
      - -retention.maxDiskSpaceUsageBytes=${LOGS_MAX_DISK:-20GB}
      - -httpAuth.username=${LOGS_USERNAME:?Set LOGS_USERNAME in .env}
      - -httpAuth.password=${LOGS_PASSWORD:?Set LOGS_PASSWORD in .env}
    volumes:
      - victorialogs-data:/victoria-logs-data
    networks: [logs]
    restart: unless-stopped

  vector:
    image: timberio/vector:0.60.0-alpine
    environment:
      LOGS_USERNAME: ${LOGS_USERNAME:?Set LOGS_USERNAME in .env}
      LOGS_PASSWORD: ${LOGS_PASSWORD:?Set LOGS_PASSWORD in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on: [victorialogs]
    networks: [logs]
    restart: unless-stopped

networks:
  logs:

volumes:
  postgres-data:
  rustfs-data:
  victorialogs-data:
