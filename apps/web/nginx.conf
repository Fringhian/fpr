user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	types {
		application/manifest+json webmanifest;
	}
	default_type application/octet-stream;
	sendfile on;
	server_tokens off;

	# A location's own add_header lines add to the server's instead of replacing them.
	add_header_inherit merge;

	# The client's address. The host's reverse proxy reaches web over the loopback address or a Docker
	# network only, so a request from those ranges takes its client address from the header the proxy
	# sets, CLIENT_IP_HEADER (client-ip.conf, written from its template when the container starts).
	# With X-Forwarded-For, the rightmost address outside these ranges is the client.
	set_real_ip_from 127.0.0.0/8;
	set_real_ip_from 10.0.0.0/8;
	set_real_ip_from 172.16.0.0/12;
	set_real_ip_from 192.168.0.0/16;
	set_real_ip_from ::1;
	set_real_ip_from fc00::/7;
	include /etc/nginx/conf.d/client-ip.conf;
	real_ip_recursive on;

	log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"request_id":"$upstream_http_x_request_id"}';
	access_log /dev/stdout json;

	server {
		listen 80;
		server_name _;
		root /srv;

		# Security headers on every response, errors included.
		add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
		add_header X-Frame-Options DENY always;
		add_header X-Content-Type-Options nosniff always;
		add_header Referrer-Policy no-referrer always;
		add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
		add_header Cross-Origin-Opener-Policy same-origin always;

		# Docker's embedded DNS. Resolving api at request time lets nginx start before the api container is up.
		resolver 127.0.0.11 valid=10s ipv6=off;

		# Proxied /api requests: the API's own security headers are dropped so only the server's values are sent.
		# X-Forwarded-For carries the client's address alone, replacing any value the request came with.
		location /api/ {
			set $api http://api:3000;
			proxy_pass $api;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_hide_header Content-Security-Policy;
			proxy_hide_header X-Frame-Options;
			proxy_hide_header X-Content-Type-Options;
			proxy_hide_header Referrer-Policy;
			proxy_hide_header Permissions-Policy;
			proxy_hide_header Cross-Origin-Opener-Policy;

			# A picture upload takes up to 2 MB, the API's own limit; every other /api body nginx's 1 MB.
			# A larger picture is answered here in the API's error format.
			location = /api/me/avatar {
				set $api http://api:3000;
				proxy_pass $api;
				client_max_body_size 2m;
				error_page 413 @avatar_too_large;
			}
		}

		location @avatar_too_large {
			default_type application/json;
			return 413 '{"error":{"code":"avatar_too_large"}}';
		}

		# Access keys travel in the path (/access/<key>). Keep those requests out of the log.
		location ^~ /access/ {
			access_log off;
			add_header Cache-Control no-cache always;
			try_files /index.html =404;
		}

		# Hashed build assets. A missing one answers 404, never index.html, and is not cached.
		location /assets/ {
			try_files $uri @missing_asset;
			add_header Cache-Control "public, max-age=31536000, immutable" always;
		}

		location @missing_asset {
			add_header Cache-Control no-cache always;
			return 404;
		}

		# index.html, the service worker and the manifest, and every route the app serves.
		location / {
			add_header Cache-Control no-cache always;
			try_files $uri /index.html;
		}
	}
}
