user nginx;
worker_processes auto;
error_log /dev/stderr warn;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	types {
		application/manifest+json webmanifest;
	}
	default_type application/octet-stream;
	sendfile on;
	server_tokens off;

	log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';
	access_log /dev/stdout json;

	server {
		listen 80;
		server_name _;
		root /srv;

		# Docker's embedded DNS. Resolving api at request time lets nginx start before the api container is up.
		resolver 127.0.0.11 valid=10s ipv6=off;

		# Proxied /api requests: the API's own Referrer-Policy is dropped so only one value is sent.
		location /api/ {
			set $api http://api:3000;
			proxy_pass $api;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-For $remote_addr;
			proxy_hide_header Referrer-Policy;
			add_header Referrer-Policy no-referrer always;
		}

		# Access keys travel in the path (/access/<key>). Keep those requests out of the log.
		location ^~ /access/ {
			access_log off;
			add_header Cache-Control no-cache always;
			add_header Referrer-Policy no-referrer always;
			try_files /index.html =404;
		}

		# Hashed build assets. A missing one answers 404, never index.html, and is not cached.
		location /assets/ {
			try_files $uri @missing_asset;
			add_header Cache-Control "public, max-age=31536000, immutable" always;
			add_header Referrer-Policy no-referrer always;
		}

		location @missing_asset {
			add_header Cache-Control no-cache always;
			add_header Referrer-Policy no-referrer always;
			return 404;
		}

		# index.html, the service worker and the manifest, and every route the app serves.
		location / {
			add_header Cache-Control no-cache always;
			add_header Referrer-Policy no-referrer always;
			try_files $uri /index.html;
		}
	}
}
