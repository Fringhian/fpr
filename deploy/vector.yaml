# Collects the output of FPR's containers and stores it in VictoriaLogs.

sources:
  containers:
    type: docker_logs
    include_labels:
      - fpr.logs=true

transforms:
  fields:
    type: remap
    inputs: [containers]
    source: |
      # A JSON line (pino) becomes fields; any other line stays a message.
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge(., object!(parsed))
      }
      if !exists(.service) {
        .service = .label."com.docker.compose.service"
      }
      .container = .container_name
      del(.label)
      del(.container_name)

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [fields]
    endpoints: ["http://victorialogs:9428/insert/elasticsearch/"]
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    auth:
      strategy: basic
      user: "${LOGS_USERNAME}"
      password: "${LOGS_PASSWORD}"
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: service,container
