# Development only: publishes the dependencies on this machine's loopback
# address, so the apps running under `pnpm dev` reach them.
services:
  postgres:
    ports:
      - 127.0.0.1:5432:5432

  rustfs:
    ports:
      - 127.0.0.1:9000:9000

  # The working copy's configuration, so an edit applies on restart without a rebuild.
  vector:
    volumes:
      - ./deploy/vector.yaml:/etc/vector/vector.yaml:ro
